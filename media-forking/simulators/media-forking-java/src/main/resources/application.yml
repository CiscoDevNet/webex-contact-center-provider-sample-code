spring:
  application:
    name: media-forking-java
  main:
    # No HTTP server is started; keep Spring Boot from booting web support.
    web-application-type: none

logging:
  level:
    root: INFO
    com.cisco.wccai: INFO

grpc:
  server:
    port: 8087
    shutdown-timeout-seconds: 30

# How the sample handles inbound forked audio frames.
forking:
  # Log a progress line every Nth frame for each conversation/role pair (use 1 to log every frame).
  log-every-n-frames: 50
  # When true, append raw forked audio bytes to a per-conversation/per-role file under capture-dir.
  # Useful for offline inspection only; leave false in production.
  write-to-file: false
  capture-dir: ${user.home}/forked-audio

# JWS/JWT authorization for inbound gRPC calls.
# Disable temporarily for local dev; in any deployed environment this MUST stay true.
auth:
  enabled: true
  # Webex Identity Broker URL for your tenant/region. Refer to the Webex CC documentation
  # for the correct value (it varies by region and by prod vs non-prod environments).
  identity-broker-url: https://<your-webex-identity-broker-host>
  public-key-cache-minutes: 60
  # Must match the value of the `com.cisco.datasource.url` claim in the inbound JWT,
  # i.e. the public URL registered with Webex CC for this Conversation Audio Forking service.
  datasource-url: https://your-forking-host.example.com:443
  # The Conversation Audio Forking schema UUID provisioned for your tenant in Control Hub.
  datasource-schema-uuid: 00000000-0000-0000-0000-000000000000
  # Allow-list of issuers (`iss` claim) accepted by this server. Refer to the Webex CC
  # documentation for the correct value(s) for your tenant/region. Add additional entries
  # if your deployment may receive traffic for multiple regions.
  valid-issuers:
    - https://<your-webex-identity-broker-host>/idb
