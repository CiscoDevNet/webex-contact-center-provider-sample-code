services:
  media-forking-java:
    image: media-forking-java:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      # Override any configuration property by prefixing with SPRING_ or using the relaxed binding.
      # Example: GRPC_SERVER_PORT=8087, AUTH_ENABLED=false
      SPRING_PROFILES_ACTIVE: default
    restart: unless-stopped
