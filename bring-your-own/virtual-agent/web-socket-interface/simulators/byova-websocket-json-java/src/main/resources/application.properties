spring.application.name=byova-websocket-json-java

# Server Configuration
server.port=8086

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging Configuration
logging.level.com.cisco.wccai=INFO
logging.level.org.springframework.web.socket=INFO

# WebSocket Configuration
spring.websocket.allowed-origins=*
# Max text message buffer size (10MB)
spring.websocket.max-text-message-buffer-size=10485760
# Max binary message buffer size (10MB)
spring.websocket.max-binary-message-buffer-size=10485760
# Max session idle timeout (15 minutes in milliseconds)
spring.websocket.max-session-idle-timeout=900000

# Tomcat WebSocket Configuration
# Set async send timeout (30 seconds)
server.tomcat.connection-timeout=30000
# Keep connection alive
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100

# voice va input config
voice.va.input.timeout-millis=10000
voice.va.no-input.timeout-millis=15000

# audio config
voice.va.audio.use-chunked-audio=true
voice.va.audio.write-to-file=false
voice.va.audio.amplitude-threshold=2000
voice.va.audio.wav.buffer-size=8000
voice.va.audio.chunk.buffer-size=4000
voice.va.audio.ignore-buffer-size=15

# dtmf config
voice.va.dtmf.input-length=9
voice.va.dtmf.inter-digit-timeout-millis=5000
voice.va.dtmf.term-char=DTMF_DIGIT_POUND

# JWS/JWT authorization for inbound WebSocket handshakes.
# Disable temporarily for local dev; in any deployed environment this MUST stay true.
auth.enabled=true
# Webex Identity Broker URL for your tenant/region. Refer to the Webex CC documentation
# for the correct value (it varies by region and by prod vs non-prod environments).
auth.identity-broker-url=https://<your-webex-identity-broker-host>
auth.public-key-cache-minutes=60
# Must match the value of the `com.cisco.datasource.url` claim in the inbound JWT,
# i.e. the public URL registered with Webex CC for this BYoVA service.
auth.datasource-url=https://your-byova-host.example.com:443
# The BYoVA schema UUID provisioned for your tenant in Control Hub.
auth.datasource-schema-uuid=00000000-0000-0000-0000-000000000000
# Allow-list of issuers (`iss` claim) accepted by this server. Refer to the Webex CC
# documentation for the correct value(s) for your tenant/region. Add additional indexed
# entries (auth.valid-issuers[1]=..., [2]=..., etc.) if your deployment may receive
# traffic for multiple regions.
auth.valid-issuers[0]=https://<your-webex-identity-broker-host>/idb

