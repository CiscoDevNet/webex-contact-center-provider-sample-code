services:
  byova-grpc-python:
    image: byova-grpc-python:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      # Override the gRPC listening port if needed.
      GRPC_SERVER_PORT: 8086
      # Number of worker threads for the gRPC ThreadPoolExecutor.
      worker_thread: 10
    restart: unless-stopped
