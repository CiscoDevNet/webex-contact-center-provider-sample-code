services:
  byova-multi-rpc-java:
    image: byova-multi-rpc-java:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      # Override any configuration property by prefixing with SPRING_ or using the relaxed binding.
      # Example: GRPC_SERVER_PORT=8086
      SPRING_PROFILES_ACTIVE: default
    restart: unless-stopped
